  <style>
    /* Базовые стили для мгновенной отрисовки темного фона */
    body {
      margin: 0;
      background-color: #09090b;
    }

    #root {
      display: contents;
    }

    /* Стили лоадера */
    .initial-loader-wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      font-family: sans-serif;
    }

    .initial-header {
      height: 72px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .initial-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at top, rgba(129, 61, 236, 0.15) 0%, transparent 50%);
    }

    .initial-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #813dec;
      border-radius: 50%;
      animation: initial-spin 1s linear infinite;
    }

    @keyframes initial-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

<body class="antialiased">
  <div id="root">
    <div class="initial-loader-wrapper">
      <div class="initial-header"></div>
      <div class="initial-main">
        <div class="initial-spinner"></div>
      </div>
    </div>
  </div>
