<body class="antialiased">
  <div id="root">
    <style>
      .shell-wrapper {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        font-family: sans-serif;
      }

      .shell-header {
        height: 72px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        padding: 0 24px;
      }

      .shell-main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at top, rgba(129, 61, 236, 0.15) 0%, transparent 50%);
      }

      .shell-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-left-color: #813dec;
        border-radius: 50%;
        animation: shell-spin 1s linear infinite;
      }

      @keyframes shell-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <div class="shell-wrapper">
      <div class="shell-header"></div>
      <div class="shell-main">
        <div class="shell-spinner"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.tsx"></script>
</body>
