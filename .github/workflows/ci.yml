# Quality gates on pull requests and pushes to `product`.
# Deploy workflows run their own pre-deploy checks before SSH/SCP deploy.

name: CI

on:
  pull_request:
    branches: [product, main]
  push:
    branches: [product]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend — test, SEO lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SITE_URL: https://explys.com
      VITE_APP_SUBSCRIPTION_DEV_MODE: "0"
      VITE_SKIP_SUBSCRIPTION_ENFORCEMENT: ""
      VITE_API_BASIC_AUTH_USER: ${{ secrets.VITE_API_BASIC_AUTH_USER }}
      VITE_API_BASIC_AUTH_PASSWORD: ${{ secrets.VITE_API_BASIC_AUTH_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: SEO route lint
        run: npm run seo:lint

      - name: Production build
        run: npm run build

  frontend-type-check:
    name: Frontend — type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

  mobile-type-check:
    name: Mobile — type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check
